<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayın Tarlası</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f0a500;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 8px rgba(240,165,0,0.3);
    }

    #panel {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1rem;
    }

    #durum {
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 120px;
      text-align: center;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      background: #16213e;
      border: 1px solid #0f3460;
      color: #a0c4ff;
      transition: color 0.3s, background 0.3s;
    }

    #durum.kazandi { color: #57e389; background: #1a3a2a; border-color: #57e389; }
    #durum.kaybetti { color: #ff6b6b; background: #3a1a1a; border-color: #ff6b6b; }

    #bayrak-sayaci {
      font-size: 1rem;
      font-weight: 600;
      color: #f0a500;
      min-width: 60px;
      text-align: center;
    }

    #yeni {
      padding: 0.45rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #f0a500, #e07b00);
      color: #1a1a2e;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 2px 8px rgba(240,165,0,0.35);
    }

    #yeni:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(240,165,0,0.5); }
    #yeni:active { transform: translateY(0); }

    #tahta {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 3px;
      background: #0f3460;
      padding: 6px;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .hucre {
      width: 40px;
      height: 40px;
      border-radius: 5px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: #16213e;
      color: transparent;
      transition: background 0.12s, transform 0.08s;
      user-select: none;
      box-shadow: inset 0 1px 3px rgba(255,255,255,0.05), 0 1px 4px rgba(0,0,0,0.3);
    }

    .hucre:hover:not(.acik):not(.bayrak) {
      background: #1e2f5e;
      transform: scale(1.07);
    }

    .hucre.bayrak {
      background: #2a1a3e;
      color: #f0a500;
    }

    .hucre.acik {
      background: #0a1628;
      cursor: default;
      transform: none;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.5);
    }

    .hucre.acik.mayinli {
      background: #3a0a0a;
      color: #ff6b6b;
    }

    /* Renk sınıfları */
    .n1 { color: #5bc0eb; }
    .n2 { color: #57e389; }
    .n3 { color: #ff6b6b; }
    .n4 { color: #a78bfa; }
    .n5 { color: #f97316; }
    .n6 { color: #06b6d4; }
    .n7 { color: #ec4899; }
    .n8 { color: #a0aec0; }

    footer {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #444a6e;
    }
  </style>
</head>
<body>

<h1>💣 Mayın Tarlası</h1>

<div id="panel">
  <span id="bayrak-sayaci">🚩 10</span>
  <span id="durum">Oyna!</span>
  <button id="yeni">Yeni Oyun</button>
</div>

<div id="tahta"></div>

<footer>9×9 ızgara · 10 mayın · Sağ tık = bayrak</footer>

<script>
(function () {
  'use strict';

  const SATIRLAR = 9;
  const SUTUNLAR = 9;
  const MAYIN_SAYISI = 10;

  let mayinlar = null;      // [[r,c], ...]  — ilk tıklamadan önce null
  let tahta = [];           // [r][c] = { mayin, sayi, acik, bayrak }
  let oyunBitti = false;
  let kalanBayrak = MAYIN_SAYISI;
  let acikHucreSayisi = 0;
  const TOPLAM_GUVENLI = SATIRLAR * SUTUNLAR - MAYIN_SAYISI;

  // ─── Genel API ─────────────────────────────────────────────────────────────
  window.mayinKonumlari = function () {
    return mayinlar;
  };

  // ─── Tahta kurulumu ────────────────────────────────────────────────────────
  function tahtaOlustur() {
    tahta = [];
    for (let r = 0; r < SATIRLAR; r++) {
      tahta[r] = [];
      for (let c = 0; c < SUTUNLAR; c++) {
        tahta[r][c] = { mayin: false, sayi: 0, acik: false, bayrak: false };
      }
    }
  }

  function mayinlariYerlestir(ilkR, ilkC) {
    const yasak = new Set();
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = ilkR + dr, nc = ilkC + dc;
        if (nr >= 0 && nr < SATIRLAR && nc >= 0 && nc < SUTUNLAR) {
          yasak.add(nr * SUTUNLAR + nc);
        }
      }
    }

    const adaylar = [];
    for (let i = 0; i < SATIRLAR * SUTUNLAR; i++) {
      if (!yasak.has(i)) adaylar.push(i);
    }

    // Fisher-Yates karıştır, ilk 10'u al
    for (let i = adaylar.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [adaylar[i], adaylar[j]] = [adaylar[j], adaylar[i]];
    }

    mayinlar = [];
    for (let k = 0; k < MAYIN_SAYISI; k++) {
      const idx = adaylar[k];
      const r = Math.floor(idx / SUTUNLAR);
      const c = idx % SUTUNLAR;
      tahta[r][c].mayin = true;
      mayinlar.push([r, c]);
    }

    // Komşu sayılarını hesapla
    for (let r = 0; r < SATIRLAR; r++) {
      for (let c = 0; c < SUTUNLAR; c++) {
        if (!tahta[r][c].mayin) {
          let sayi = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < SATIRLAR && nc >= 0 && nc < SUTUNLAR && tahta[nr][nc].mayin) {
                sayi++;
              }
            }
          }
          tahta[r][c].sayi = sayi;
        }
      }
    }
  }

  // ─── Hücre açma ────────────────────────────────────────────────────────────
  function ac(r, c) {
    if (oyunBitti) return;
    const h = tahta[r][c];
    if (h.acik || h.bayrak) return;

    // İlk tıklama: mayınları yerleştir
    if (mayinlar === null) {
      mayinlariYerlestir(r, c);
    }

    h.acik = true;
    acikHucreSayisi++;

    if (h.mayin) {
      guncelleDom(r, c);
      oyunKaybet();
      return;
    }

    guncelleDom(r, c);

    if (h.sayi === 0) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < SATIRLAR && nc >= 0 && nc < SUTUNLAR) {
            ac(nr, nc);
          }
        }
      }
    }

    if (acikHucreSayisi === TOPLAM_GUVENLI) {
      oyunKazan();
    }
  }

  function bayrakDegistir(r, c) {
    if (oyunBitti) return;
    const h = tahta[r][c];
    if (h.acik) return;

    if (h.bayrak) {
      h.bayrak = false;
      kalanBayrak++;
    } else {
      if (kalanBayrak <= 0) return;
      h.bayrak = true;
      kalanBayrak--;
    }

    guncelleDom(r, c);
    document.getElementById('bayrak-sayaci').textContent = '🚩 ' + kalanBayrak;
  }

  // ─── Oyun sonu ─────────────────────────────────────────────────────────────
  function oyunKazan() {
    oyunBitti = true;
    const el = document.getElementById('durum');
    el.textContent = 'Kazandın 🎉';
    el.className = 'kazandi';
  }

  function oyunKaybet() {
    oyunBitti = true;
    const el = document.getElementById('durum');
    el.textContent = 'Kaybettin 💥';
    el.className = 'kaybetti';

    // Tüm mayınları göster
    for (const [mr, mc] of mayinlar) {
      const hucre = tahta[mr][mc];
      hucre.acik = true;
      guncelleDom(mr, mc);
    }
  }

  // ─── DOM güncelleme ────────────────────────────────────────────────────────
  const renkSinifi = ['', 'n1', 'n2', 'n3', 'n4', 'n5', 'n6', 'n7', 'n8'];

  function guncelleDom(r, c) {
    const el = document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    if (!el) return;
    const h = tahta[r][c];

    // Sınıfları sıfırla
    el.className = 'hucre';
    el.textContent = '';

    if (h.acik) {
      el.classList.add('acik');
      if (h.mayin) {
        el.classList.add('mayinli');
        el.textContent = '💣';
      } else if (h.sayi > 0) {
        el.classList.add(renkSinifi[h.sayi]);
        el.textContent = h.sayi;
      }
      // sayi === 0: metin boş kalır
    } else if (h.bayrak) {
      el.classList.add('bayrak');
      el.textContent = '🚩';
    }
  }

  // ─── DOM oluşturma ─────────────────────────────────────────────────────────
  function domOlustur() {
    const tahtaEl = document.getElementById('tahta');
    tahtaEl.innerHTML = '';
    for (let r = 0; r < SATIRLAR; r++) {
      for (let c = 0; c < SUTUNLAR; c++) {
        const el = document.createElement('div');
        el.className = 'hucre';
        el.dataset.r = r;
        el.dataset.c = c;

        el.addEventListener('click', () => ac(r, c));
        el.addEventListener('contextmenu', (e) => { e.preventDefault(); bayrakDegistir(r, c); });

        tahtaEl.appendChild(el);
      }
    }
  }

  // ─── Yeni oyun ─────────────────────────────────────────────────────────────
  function yeniOyun() {
    mayinlar = null;
    oyunBitti = false;
    kalanBayrak = MAYIN_SAYISI;
    acikHucreSayisi = 0;

    const durum = document.getElementById('durum');
    durum.textContent = 'Oyna!';
    durum.className = '';

    document.getElementById('bayrak-sayaci').textContent = '🚩 ' + kalanBayrak;

    tahtaOlustur();
    domOlustur();
  }

  // ─── Başlat ────────────────────────────────────────────────────────────────
  document.getElementById('yeni').addEventListener('click', yeniOyun);
  yeniOyun();

})();
</script>

</body>
</html>
